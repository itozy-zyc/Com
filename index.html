<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamepass24h.com - Shop Roblox Uy Tín</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
        }
        /* Header */
        header {
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            color: #ffcc00;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
        }
        .btn-login {
            background-color: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        /* Banner Gamepass24h */
        .banner {
            width: 100%;
            background: linear-gradient(135deg, #b71c1c, #d32f2f, #f57c00);
            padding: 20px 10px;
            text-align: center;
            color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .banner h1 {
            font-size: 22px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
            text-transform: uppercase;
            color: #ffeb3b;
        }
        .banner p {
            font-size: 13px;
            font-weight: bold;
        }

        /* Container */
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Box Xếp Hạng */
        .ranking-box {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .ranking-title {
            background: #e74c3c;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .ranking-item span:last-child {
            color: #e74c3c;
            font-weight: bold;
        }

        /* Nút Nạp Ngay */
        .btn-nap {
            display: block;
            background-color: #e74c3c;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin: 15px 0;
            text-transform: uppercase;
        }

        /* Modal Đăng nhập / Đăng ký */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #aaa;
        }
        .modal-tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            color: #77f;
        }
        .tab.active {
            color: #e74c3c;
            border-bottom: 2px solid #e74c3c;
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .form-box {
            display: none;
        }
        .form-box.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">GAMEPASS24H.COM</div>
        <button class="btn-login" onclick="openModal()">ĐĂNG NHẬP</button>
    </header>

    <!-- Banner Gamepass24h -->
    <div class="banner">
        <h1>GAMEPASS24H.COM</h1>
        <p>⚡ Chuyên Mua Bán Robux, Gamepass, Cày Thuê Blox Fruit Uy Tín ⚡</p>
    </div>

    <div class="container">
        <!-- Bảng xếp hạng nạp thẻ -->
        <div class="ranking-box">
            <div class="ranking-title">TOP NẠP THẺ THÁNG 10</div>
            <div class="ranking-item">
                <span>1. katanashi</span>
                <span>12.150.000đ</span>
            </div>
            <div class="ranking-item">
                <span>2. gosukumi</span>
                <span>11.850.000đ</span>
            </div>
            <div class="ranking-item">
                <span>3. akitino</span>
                <span>11.200.000đ</span>
            </div>
        </div>

        <a href="#" class="btn-nap">NẠP THẺ NGAY</a>
    </div>

    <!-- Modal Đăng Nhập / Đăng Ký -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="modal-tabs">
                <div class="tab active" onclick="switchTab('login')">Đăng Nhập</div>
                <div class="tab" onclick="switchTab('register')">Đăng Ký</div>
            </div>

            <!-- Form Đăng Nhập -->
            <div id="loginForm" class="form-box active">
                <div class="form-group">
                    <label>Tài khoản / Email</label>
                    <input type="text" placeholder="Nhập tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu...">
                </div>
                <button class="btn-submit">ĐĂNG NHẬP</button>
            </div>

            <!-- Form Đăng Ký -->
            <div id="registerForm" class="form-box">
                <div class="form-group">
                    <label>Tài khoản mới</label>
                    <input type="text" placeholder="Chọn tên tài khoản...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Tạo mật khẩu...">
                </div>
                <div class="form-group">
                    <label>Nhập lại mật khẩu</label>
                    <input type="password" placeholder="Xác nhận mật khẩu...">
                </div>
                <button class="btn-submit">ĐĂNG KÝ</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('authModal');
        
        function openModal() {
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Bấm ra ngoài modal thì tự động đóng
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-box');

            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            if (tabName === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
    </script>

</body>
</html>
