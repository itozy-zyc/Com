<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            background: linear-gradient(#87CEEB, #E0F6FF); /* Bầu trời */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 10px;
        }
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="scoreBoard">Điểm: 0</div>
    
    <div id="gameOver">
        <h2>Game Over!</h2>
        <p>Bạn đã va vào vật cản.</p>
        <button onclick="resetGame()">Chơi lại</button>
    </div>

    <canvas id="gameCanvas" width="400" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('scoreBoard');
        const gameOverScreen = document.getElementById('gameOver');

        // Cấu hình game
        const LANE_COUNT = 3;
        const LANE_WIDTH = 100;
        const PLAYER_WIDTH = 40;
        const PLAYER_HEIGHT = 70;
        
        // Tính toán vị trí 3 làn đường
        const startX = (canvas.width - (LANE_COUNT * LANE_WIDTH)) / 2;
        const lanes = [
            startX + LANE_WIDTH / 2,
            startX + LANE_WIDTH + LANE_WIDTH / 2,
            startX + LANE_WIDTH * 2 + LANE_WIDTH / 2
        ];

        let player = {
            x: lanes[1], // Bắt đầu ở làn giữa
            y: canvas.height - 120,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            currentLane: 1,
            targetX: lanes[1]
        };

        let obstacles = [];
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let frameCount = 0;

        // Xử lý phím bấm
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;

            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && player.currentLane > 0) {
                player.currentLane--;
                player.targetX = lanes[player.currentLane];
            } else if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && player.currentLane < 2) {
                player.currentLane++;
                player.targetX = lanes[player.currentLane];
            }
        });

        // Hàm tạo vật cản ngẫu nhiên
        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * LANE_COUNT);
            obstacles.push({
                x: lanes[laneIndex] - 25, // Căn giữa vật cản
                y: -100,
                width: 50,
                height: 50,
                lane: laneIndex
            });
        }

        // Vẽ hình chữ nhật bo góc cho đẹp
        function drawRoundedRect(x, y, width, height, radius, color) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.closePath();
        }

        // Hàm vẽ chính
        function draw() {
            // Xóa màn hình
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Vẽ đường ray (3 làn)
            ctx.fillStyle = '#555';
            ctx.fillRect(startX, 0, LANE_WIDTH * LANE_COUNT, canvas.height);
            
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 4;
            for (let i = 0; i <= LANE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(startX + i * LANE_WIDTH, 0);
                ctx.lineTo(startX + i * LANE_WIDTH, canvas.height);
                ctx.stroke();
            }

            // Hiệu ứng đường chạy (thanh ngang)
            ctx.fillStyle = '#444';
            for (let i = 0; i < canvas.height; i += 40) {
                let offset = (frameCount * gameSpeed) % 40;
                ctx.fillRect(startX, i + offset, LANE_WIDTH * LANE_COUNT, 10);
            }

            // 2. Vẽ vật cản
            ctx.fillStyle = '#ff4757';
            obstacles.forEach(obs => {
                drawRoundedRect(obs.x, obs.y, obs.width, obs.height, 5, '#ff4757');
            });

            // 3. Vẽ nhân vật (Player)
            // Nội suy vị trí để di chuyển mượt mà
            player.x += (player.targetX - player.x) * 0.2;
            
            // Vẽ thân
            drawRoundedRect(player.x - player.width/2, player.y, player.width, player.height, 10, '#3498db');
            
            // Vẽ đầu
            ctx.beginPath();
            ctx.arc(player.x, player.y - 15, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#f1c40f';
            ctx.fill();
            ctx.closePath();
        }

        // Hàm cập nhật logic game
        function update() {
            if (isGameOver) return;
            
            frameCount++;

            // Tăng điểm theo thời gian
            if (frameCount % 10 === 0) {
                score++;
                scoreElement.innerText = "Điểm: " + score;
            }

            // Tăng tốc độ game dần dần
            if (frameCount % 600 === 0) {
                gameSpeed += 0.5;
            }

            // Tạo vật cản
            if (frameCount % 80 === 0) {
                spawnObstacle();
            }

            // Di chuyển vật cản
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += gameSpeed;

                // Xóa vật cản khi ra khỏi màn hình
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }

                // Kiểm tra va chạm (AABB Collision)
                let obs = obstacles[i];
                if (
                    player.x - player.width/2 < obs.x + obs.width &&
                    player.x + player.width/2 > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y
                ) {
                    // Nếu va chạm
                    isGameOver = true;
                    gameOverScreen.style.display = 'block';
                }
            }
        }

        // Vòng lặp game
        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Reset game
        function resetGame() {
            player.x = lanes[1];
            player.targetX = lanes[1];
            player.currentLane = 1;
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            frameCount = 0;
            scoreElement.innerText = "Điểm: 0";
            gameOverScreen.style.display = 'none';
            gameLoop();
        }

        // Bắt đầu game
        gameLoop();
    </script>
</body>
</html>
