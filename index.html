<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway 3D Real Model</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Arial', sans-serif; touch-action: none;}
        canvas { display: block; }
        #score { position: absolute; top: 20px; left: 20px; color: white; font-size: 30px; font-weight: 900; text-shadow: 2px 2px 0 #000; z-index: 10;}
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px; text-align: center; border-radius: 10px; display: none; z-index: 10;}
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #2ecc71; color: white; border: none; border-radius: 5px; margin-top: 10px;}
    </style>
</head>
<body>

    <div id="score">Điểm: 0</div>
    <div id="game-over">
        <h2>Bạn Đã Thua!</h2>
        <button onclick="resetGame()">Chơi Lại</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // Cảnh 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 12);
        camera.lookAt(0, 2, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Môi trường đường ray
        const laneWidth = 3.5;
        const LANES = [-laneWidth, 0, laneWidth];
        
        const floorGeo = new THREE.PlaneGeometry(laneWidth * 3, 500);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -200;
        floor.receiveShadow = true;
        scene.add(floor);

        for(let i = -250; i < 50; i+= 5) {
            const barGeo = new THREE.PlaneGeometry(laneWidth * 3, 0.5);
            const barMat = new THREE.MeshLambertMaterial({ color: 0x777777 });
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.rotation.x = -Math.PI / 2;
            bar.position.set(0, 0.01, i);
            scene.add(bar);
        }

        // Nhân vật (Tải Model 3D thực từ mạng)
        let player;
        let mixer;
        let actions = {};
        let isJumping = false;
        let isSliding = false;
        let targetY = 1.5;
        let currentLane = 1;
        
        const loader = new THREE.GLTFLoader();
        // Tải model nhân vật "Xbot" (có sẵn hoạt ảnh chạy, nhảy)
        loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', function (gltf) {
            player = gltf.scene;
            player.scale.set(0.5, 0.5, 0.5);
            player.position.set(0, 1.5, 5);
            player.castShadow = true;
            scene.add(player);

            mixer = new THREE.AnimationMixer(player);
            const animations = gltf.animations;
            actions['run'] = mixer.clipAction(THREE.AnimationClip.findByName(animations, 'run'));
            actions['jump'] = mixer.clipAction(THREE.AnimationClip.findByName(animations, 'jump'));
            
            if(actions['run']) actions['run'].play();
        });

        // Vật cản (Tàu hỏa)
        let obstacles = [];
        const trainGeo = new THREE.BoxGeometry(2.8, 4.5, 12);
        const trainMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });

        function spawnTrain() {
            const lane = Math.floor(Math.random() * 3);
            const train = new THREE.Mesh(trainGeo, trainMat);
            train.position.set(LANES[lane], 2.25, -100);
            train.castShadow = true;
            scene.add(train);
            obstacles.push(train);
        }

        // Game Logic
        let score = 0;
        let speed = 0.5;
        let isGameOver = false;
        const scoreEl = document.getElementById('score');

        function move(dir) {
            if (isGameOver || !player) return;
            if (dir === 'left' && currentLane > 0) currentLane--;
            if (dir === 'right' && currentLane < 2) currentLane++;
            
            if (dir === 'jump' && !isJumping) {
                isJumping = true;
                targetY = 4.5;
                if(actions['jump']) {
                    actions['run'].stop();
                    actions['jump'].reset().play();
                }
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
            if (e.key === 'ArrowRight' || e.key === 'd') move('right');
            if (e.key === 'ArrowUp' || e.key === 'w') move('jump');
        });

        // Vuốt cảm ứng
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        document.addEventListener('touchend', e => {
            let diffX = e.changedTouches[0].screenX - touchStartX;
            let diffY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (diffX > 0) move('right'); else move('left');
            } else if (Math.abs(diffY) > 30) {
                if (diffY < 0) move('jump');
            }
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (!isGameOver && player) {
                if (mixer) mixer.update(delta);

                score++;
                if (score % 10 === 0) scoreEl.innerText = "Điểm: " + Math.floor(score/10);

                // Di chuyển sang làn
                let targetX = LANES[currentLane];
                player.position.x += (targetX - player.position.x) * 0.2;

                // Vật lý nhảy
                player.position.y += (targetY - player.position.y) * 0.2;
                if (isJumping && Math.abs(player.position.y - targetY) < 0.1) {
                    targetY = 1.5;
                    isJumping = false;
                    if(actions['run']) { actions['jump'].stop(); actions['run'].play(); }
                }

                // Sinh tàu
                if (Math.random() < 0.015) spawnTrain();

                // Tàu chạy
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += speed * 15;

                    // Va chạm
                    if (Math.abs(obs.position.z - player.position.z) < 6 && Math.abs(obs.position.x - player.position.x) < 1.5) {
                        if (!(isJumping && player.position.y > 3)) { // Nếu đang nhảy cao thì không sao
                            isGameOver = true;
                            document.getElementById('game-over').style.display = 'block';
                        }
                    }

                    if (obs.position.z > 20) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            scoreEl.innerText = "Điểm: 0";
            document.getElementById('game-over').style.display = 'none';
            currentLane = 1;
            if(player) {
                player.position.set(0, 1.5, 5);
                targetY = 1.5;
                isJumping = false;
            }
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            if(actions['run']) actions['run'].play();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
