<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Subway Surfers 3D Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: Arial; }
        #score { position: absolute; top: 20px; left: 20px; color: white; font-size: 30px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #game-over { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white; padding: 30px; text-align: center; border-radius: 10px; display: none;
        }
        button { padding: 10px 20px; font-size: 20px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 5px; margin-top: 10px;}
    </style>
</head>
<body>

    <div id="score">Điểm: 0</div>
    <div id="game-over">
        <h1>Game Over!</h1>
        <p>Bạn đã đâm vào tàu hỏa.</p>
        <button onclick="resetGame()">Chơi Lại</button>
    </div>

    <!-- Tải thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. KHỞI TẠO CẢNH 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Màu trời xanh
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Sương mù che khuất phía xa

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // Đặt camera phía sau và trên cao
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 2. TẠO MÔI TRƯỜNG (ĐƯỜNG RAY)
        const trackWidth = 12;
        const trackLength = 1000;
        const laneWidth = 4;
        
        // Mặt đất
        const floorGeo = new THREE.PlaneGeometry(trackWidth, trackLength);
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -trackLength / 2 + 20; // Kéo dài về phía trước
        scene.add(floor);

        // Vạch kẻ làn đường
        for (let i = -1; i <= 1; i+=2) {
            const lineGeo = new THREE.PlaneGeometry(0.2, trackLength);
            const lineMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(i * laneWidth/2, 0.01, -trackLength / 2 + 20);
            scene.add(line);
        }

        // 3. TẠO NHÂN VẬT (Player)
        const playerGeo = new THREE.BoxGeometry(1.5, 3, 1.5); // Khối hộp thay cho người
        const playerMat = new THREE.MeshLambertMaterial({ color: 0x3498db }); // Màu xanh
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 1.5; // Đặt trên mặt đất
        player.position.z = 5;
        scene.add(player);

        const LANES = [-laneWidth, 0, laneWidth]; // Tọa độ X của 3 làn
        let currentLane = 1; // Bắt đầu ở giữa

        // 4. TẠO VẬT CẢN (TÀU HỎA)
        let obstacles = [];
        const obstacleGeo = new THREE.BoxGeometry(2.5, 4, 8); // Hình tàu hỏa
        const obstacleMat = new THREE.MeshLambertMaterial({ color: 0xff4757 }); // Màu đỏ

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 3); // Random 1 trong 3 làn
            const obs = new THREE.Mesh(obstacleGeo, obstacleMat);
            obs.position.set(LANES[lane], 2, -100); // Sinh ra ở phía xa
            scene.add(obs);
            obstacles.push(obs);
        }

        // 5. LOGIC GAME
        let score = 0;
        let gameSpeed = 0.5;
        let isGameOver = false;
        let scoreDisplay = document.getElementById('score');
        let gameOverScreen = document.getElementById('game-over');

        // Điều khiển
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) {
                currentLane--;
            } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) {
                currentLane++;
            }
        });

        // Hiệu ứng di chuyển mượt
        function updatePlayer() {
            const targetX = LANES[currentLane];
            player.position.x += (targetX - player.position.x) * 0.2;
        }

        // Vòng lặp Render (60fps)
        function animate() {
            requestAnimationFrame(animate);

            if (!isGameOver) {
                updatePlayer();

                // Tăng điểm
                score += 1;
                if (score % 10 === 0) scoreDisplay.innerText = "Điểm: " + Math.floor(score/10);

                // Sinh vật cản
                if (Math.random() < 0.02) spawnObstacle();

                // Di chuyển vật cản
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed; // Di chuyển về phía người chơi

                    // Va chạm (Khoảng cách Z và X)
                    if (Math.abs(obs.position.z - player.position.z) < 4 && Math.abs(obs.position.x - player.position.x) < 1.5) {
                        isGameOver = true;
                        gameOverScreen.style.display = 'block';
                    }

                    // Xóa vật cản khi đi qua màn hình
                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            scoreDisplay.innerText = "Điểm: 0";
            gameOverScreen.style.display = 'none';
            currentLane = 1;
            player.position.x = 0;
            
            // Xóa hết vật cản cũ
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
        }

        // Xử lý khi thay đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Bắt đầu game
        animate();
    </script>
</body>
</html>
