<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Metro Runner</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; overflow: hidden; background: #87CEEB; font-family: "Segoe UI", Tahoma, sans-serif; user-select: none; touch-action: none; }
  #game-container { width: 100vw; height: 100vh; }

  /* ===== TAP TO START ===== */
  #tap-to-start {
    position: fixed; inset: 0; z-index: 99999;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; text-align: center; padding: 20px;
  }
  #tap-to-start h1 {
    font-size: clamp(36px, 8vw, 72px); margin: 0 0 10px 0;
    color: #ffeb3b; text-transform: uppercase; letter-spacing: 3px;
    text-shadow: 4px 4px 0 #000;
  }
  #tap-to-start .sub {
    font-size: clamp(14px, 2.5vw, 18px); color: #ddd; margin-bottom: 30px;
    line-height: 1.7;
  }
  #tap-to-start .play-btn {
    background: #ffeb3b; color: #222; font-size: clamp(20px, 4vw, 28px);
    font-weight: 900; padding: 18px 50px; border-radius: 14px;
    box-shadow: 0 6px 0 #fbc02d; text-transform: uppercase; letter-spacing: 2px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  #tap-to-start .keys {
    margin-top: 30px; font-size: 13px; color: #aaa;
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  }
  #tap-to-start .keys span {
    background: rgba(255,255,255,0.12); padding: 6px 12px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  }
  #tap-to-start .asset-status {
    margin-top: 20px; font-size: 12px; color: #8f8; opacity: 0.7;
    max-width: 400px; line-height: 1.6;
  }

  /* ===== HUD ===== */
  #score-board {
    position: absolute; top: 20px; right: 20px;
    font-size: 40px; font-weight: 900; color: #ffeb3b;
    text-shadow: 3px 3px 0 #000;
    font-family: "Arial Black", sans-serif; font-style: italic;
    display: none; z-index: 60;
  }
  #coin-board {
    position: absolute; top: 68px; right: 22px;
    font-size: 20px; font-weight: 900; color: #fff;
    text-shadow: 2px 2px 0 #000;
    font-family: "Arial Black", sans-serif;
    display: none; z-index: 60;
  }
  #combo-board {
    position: absolute; top: 98px; right: 22px;
    font-size: 18px; font-weight: 900; color: #a7ffeb;
    text-shadow: 2px 2px 0 #000;
    font-family: "Arial Black", sans-serif;
    display: none; z-index: 60;
  }
  #best-board {
    position: absolute; top: 20px; left: 20px;
    font-size: 14px; font-weight: 700; color: #fff;
    text-shadow: 2px 2px 0 #000;
    display: none; z-index: 60;
    background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 8px;
  }

  #toast {
    position: absolute; top: 140px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(22px, 4vw, 34px); font-weight: 900;
    font-family: "Arial Black", sans-serif; color: #fff;
    text-shadow: 3px 3px 0 #000;
    opacity: 0; pointer-events: none; z-index: 80;
    transition: opacity 0.15s, transform 0.15s;
    text-align: center; white-space: nowrap;
  }

  #pause-overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); z-index: 1500;
    color: #fff; font-size: 60px; font-weight: 900;
    text-shadow: 3px 3px 0 #000; flex-direction: column;
  }
  #pause-sub { font-size: 16px; color: #ddd; margin-top: 20px; text-shadow: 2px 2px 0 #000; }

  #hud-controls {
    position: absolute; bottom: 18px; left: 18px;
    display: none; gap: 10px; align-items: center; z-index: 70;
    background: rgba(0,0,0,0.4); padding: 10px 12px; border-radius: 12px;
    backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.15); color: #fff;
  }
  #btn-mute {
    width: 44px; height: 44px; border-radius: 10px;
    background: rgba(255,255,255,0.14); color: #fff; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 1px solid rgba(255,255,255,0.22); user-select: none;
  }
  #btn-mute:hover { background: rgba(255,255,255,0.22); }
  #vol { width: 120px; accent-color: #ffeb3b; }
  #hud-tip { font-size: 12px; color: #ddd; }

  #game-over-screen {
    position: absolute; inset: 0; background: rgba(0,0,0,0.88);
    display: none; flex-direction: column; justify-content: center; align-items: center;
    z-index: 2000; color: #fff; padding: 20px;
  }
  #game-over-screen h1 {
    font-size: clamp(42px, 9vw, 72px); color: #f44336;
    text-shadow: 3px 3px 0 #000; margin: 0 0 20px 0;
  }
  #final-score {
    font-size: clamp(16px, 3vw, 22px); margin-bottom: 26px; color: #ffeb3b;
    text-align: center; line-height: 1.7;
  }
  #final-score .newbest { color: #4caf50; font-weight: 900; font-size: 1.2em; }
  #btn-restart {
    padding: 15px 40px; font-size: 22px; background: #4caf50;
    color: #fff; border: none; border-radius: 10px; cursor: pointer;
    font-weight: 900; box-shadow: 0 4px 0 #2e7d32;
  }
  #btn-restart:hover { background: #45a049; }

  #touch-controls {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: none; justify-content: space-between; padding: 20px;
    pointer-events: none; z-index: 65;
  }
  .touch-group { display: flex; gap: 10px; pointer-events: auto; }
  .touch-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center;
    user-select: none; backdrop-filter: blur(4px);
  }
  .touch-btn:active { background: rgba(255,255,255,0.4); }
  @media (max-width: 768px) and (hover: none) {
    #touch-controls { display: flex; }
    #hud-controls { bottom: auto; top: 130px; left: 10px; }
  }

  #mini-loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #ffeb3b; font-size: 20px; font-weight: 700;
    display: none; z-index: 90; text-shadow: 2px 2px 0 #000; text-align: center;
  }
</style>

<div id="tap-to-start">
  <h1>Metro Runner</h1>
  <div class="sub">Chạy không giới hạn — né tàu, nhặt coin, phá kỷ lục!</div>
  <div class="play-btn" id="play-btn">▶ CHƠI NGAY</div>
  <div class="keys">
    <span>A/D ← → : Đổi làn</span>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

// ===== FIXED LANES =====
const FIXED_LANE_XS = [ 3.8, 0.0, -3.8 ];

// ===== MODEL PATHS =====
// Đặt file .glb vào thư mục /models/ cùng cấp với index.html
const MODEL_PATHS = {
  player: "./models/player.glb",
  map:    "./models/map.glb",
  coin:   "./models/coin.glb",
  train:  "./models/train.glb"
};

// ===== CONFIG =====
const config = {
  laneWidth: 3.8,
  camDist: 8.0, camHeight: 5.0, camLookHeight: 2.0,
  walkableNormalY: 0.35, groundRayUp: 12.0, groundRayDown: 110.0,
  groundSnapSpeed: 18.0, maxStepUp: 4.0,
  collisionHeightsStand: [0.45, 1.20, 1.95],
  collisionHeightsRoll:  [0.30, 0.85],
  collisionIgnoreBelowFeet: 0.15,
  frontalNormalZThreshold: -0.35,
  landingSnapEps: 0.35, landingMaxDrop: 1.2, laneSnapEps: 0.02,
  coinHover: 1.1, coinPickupRadius: 1.25, coinSpinSpeed: 5.0,
  coinScore: 120, coinMinSpacing: 1.8,
  trainSpawnZMin: 90, trainSpawnZMax: 150, trainDespawnBehind: 60,
  trainPickupRadius: 0.85, trainTopSafeEps: 0.25,
  trainWaveZJitter: 6.0, trainLaneMinGapZ: 35,
  nearMissMaxDZ: 1.6, nearMissMaxDX: 2.0,
  nearMissBonus: 600, nearMissShake: 0.35, cameraShakeDecay: 8.0,
  fovBase: 60, fovMaxAdd: 10,
  comboWindow: 1.6, comboMax: 8,
  coyoteTime: 0.10, jumpBufferTime: 0.12,
  ignoreNameParts: ["nocollide", "decor", "fx", "particle", "trigger", "helper", "coin"]
};

const DIFF = {
  easy:   { name: "Dễ",  runSpeedStart: 12.5, runSpeedMax: 22, speedAccel: 0.95, laneSwitchSpeed: 12.0, jumpForce: 12.5, gravity: 28, collisionDistance: 1.20, coinsPerTile: 18, trainSpeed: 22, trainSpawnMin: 2.6, trainSpawnMax: 4.0, trainWaveChance2: 0.24 },
  normal: { name: "Vừa", runSpeedStart: 15.5, runSpeedMax: 28, speedAccel: 1.35, laneSwitchSpeed: 10.0, jumpForce: 12.0, gravity: 30, collisionDistance: 1.35, coinsPerTile: 14, trainSpeed: 28, trainSpawnMin: 1.9, trainSpawnMax: 3.0, trainWaveChance2: 0.40 },
  hard:   { name: "Khó", runSpeedStart: 18.5, runSpeedMax: 36, speedAccel: 1.90, laneSwitchSpeed: 8.8, jumpForce: 11.6, gravity: 32, collisionDistance: 1.45, coinsPerTile: 10, trainSpeed: 32, trainSpawnMin: 1.25, trainSpawnMax: 2.2, trainWaveChance2: 0.60 }
};

const params = { ...DIFF.normal };

// ===== GLOBAL =====
let scene, camera, renderer, clock;
let player, mixer;
let mapTiles = [];
let mapTemplate = null;
let mapLength = 60;

let isGameRunning = false;
let isGameOver = false;
let isPaused = false;

let laneCenters = [ ...FIXED_LANE_XS ];
let currentLane = 1;
let targetX = laneCenters[currentLane];

let verticalVelocity = 0;
let isJumping = false;
let isRolling = false;
let rollTimer = 0;
let coyoteTimer = 0;
let jumpBufferTimer = 0;

let score = 0;
let coins = 0;
let combo = 1;
let lastCoinTime = -9999;

let baseY = 0;
let playerFootOffsetY = 0;

let actions = {};
let activeAction;

let raycaster;
let coinTemplate = null;
let coinTemplateScale = 1.0;
let trainTemplate = null;
let trainTemplateScale = 1.0;

let trains = [];
let trainSpawnTimer = 2.0;

let shakeAmp = 0;
let particleGroup = null;

let lastDebugUpdate = 0;
let bestScore = parseInt(localStorage.getItem("metroBest") || "0", 10);

// ===== AUDIO =====
const AudioFX = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  muted: false, startedMusic: false, vol: 0.70,
  _musicTimer: null, _musicStep: 0, _musicTempo: 115,
  _musicNotes: [ 0, 7, 12, 7, 3, 10, 15, 10 ], _musicRoot: 220,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.musicGain = this.ctx.createGain();
    this.sfxGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.45;
    this.sfxGain.gain.value = 0.9;
    this.master.gain.value = this.vol;
    this.musicGain.connect(this.master);
    this.sfxGain.connect(this.master);
    this.master.connect(this.ctx.destination);
  },
  setVolume(v01) {
    this.vol = Math.max(0, Math.min(1, v01));
    if (this.master) this.master.gain.value = this.muted ? 0 : this.vol;
  },
  setMuted(m) {
    this.muted = !!m;
    if (this.master) this.master.gain.value = this.muted ? 0 : this.vol;
  },
  async unlock() {
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === "suspended") { try { await this.ctx.resume(); } catch {} }
    if (!this.startedMusic) this.startMusic();
  },
  _tone({ freq=440, dur=0.12, type="sine", gain=0.2, detune=0, attack=0.002, release=0.06, slideTo=null }) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    osc.detune.setValueAtTime(detune, t0);
    if (slideTo != null) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + release);
    osc.connect(g); g.connect(this.sfxGain);
    osc.start(t0); osc.stop(t0 + dur + release + 0.02);
  },
  _noise({ dur=0.08, gain=0.18, tone=900, q=0.7 }) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const bufferSize = Math.floor(this.ctx.sampleRate * dur);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.4);
    const src = this.ctx.createBufferSource(); src.buffer = buffer;
    const biq = this.ctx.createBiquadFilter();
    biq.type = "bandpass"; biq.frequency.value = tone; biq.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.06);
    src.connect(biq); biq.connect(g); g.connect(this.sfxGain);
    src.start(t0); src.stop(t0 + dur + 0.08);
  },
  sfxSwitch() { this._tone({ freq: 700, dur: 0.035, type: "square", gain: 0.10, release: 0.03 }); },
  sfxJump()   { this._tone({ freq: 520, dur: 0.10, type: "triangle", gain: 0.22, slideTo: 880, release: 0.08 }); },
  sfxRoll()   { this._tone({ freq: 220, dur: 0.12, type: "sawtooth", gain: 0.14, slideTo: 130, release: 0.08 }); this._noise({ dur: 0.10, gain: 0.10, tone: 1200 }); },
  sfxCoin()   { this._tone({ freq: 880, dur: 0.06, type: "sine", gain: 0.22, release: 0.08 }); this._tone({ freq: 1320, dur: 0.05, type: "sine", gain: 0.16, release: 0.08 }); },
  sfxCombo()  { this._tone({ freq: 990, dur: 0.08, type: "triangle", gain: 0.20, slideTo: 1480, release: 0.10 }); },
  sfxNear()   { this._noise({ dur: 0.12, gain: 0.16, tone: 700, q: 0.6 }); this._tone({ freq: 180, dur: 0.09, type: "sine", gain: 0.10, slideTo: 120 }); },
  sfxHorn()   { this._tone({ freq: 392, dur: 0.20, type: "square", gain: 0.14, release: 0.10 }); this._tone({ freq: 294, dur: 0.24, type: "square", gain: 0.12, release: 0.12, detune: -10 }); },
  sfxGameOver() { this._tone({ freq: 392, dur: 0.14, type: "triangle", gain: 0.22, slideTo: 196, release: 0.20 }); this._noise({ dur: 0.16, gain: 0.12, tone: 400, q: 0.8 }); },
  startMusic() {
    if (!this.ctx || this.startedMusic) return;
    this.startedMusic = true;
    const stepDur = 60 / this._musicTempo / 2;
    const scheduleAhead = 0.10;
    let nextTime = this.ctx.currentTime + 0.02;
    const tick = () => {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      while (nextTime < now + scheduleAhead) {
        const s = this._musicStep++ % this._musicNotes.length;
        const semi = this._musicNotes[s];
        const freq = this._musicRoot * Math.pow(2, semi / 12);
        this._musicPluck(freq, nextTime, stepDur * 0.95, 0.08);
        if ((this._musicStep % 4) === 0) this._musicKick(nextTime);
        if ((this._musicStep % 2) === 0) this._musicHat(nextTime);
        nextTime += stepDur;
      }
    };
    this._musicTimer = setInterval(tick, 25);
  },
  stopMusic() {
    if (this._musicTimer) clearInterval(this._musicTimer);
    this._musicTimer = null;
    this.startedMusic = false;
  },
  _musicPluck(freq, t, dur, amp) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq, t);
    f.type = "lowpass"; f.frequency.setValueAtTime(1800, t); f.Q.value = 0.7;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(f); f.connect(g); g.connect(this.musicGain);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  _musicKick(t) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(45, t + 0.10);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.12, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(g); g.connect(this.musicGain);
    osc.start(t); osc.stop(t + 0.14);
  },
  _musicHat(t) {
    if (!this.ctx) return;
    const bufferSize = Math.floor(this.ctx.sampleRate * 0.03);
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.7);
    const src = this.ctx.createBufferSource(); src.buffer = buffer;
    const hp = this.ctx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 6000;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    src.connect(hp); hp.connect(g); g.connect(this.musicGain);
    src.start(t); src.stop(t + 0.06);
  }
};

// ===== helpers =====
function smoothAlpha(speed, dt) { return 1 - Math.exp(-speed * dt); }
function rand(a, b) { return a + Math.random() * (b - a); }
function isIgnoredObject(obj) {
  const n = (obj?.name || "").toLowerCase();
  if (!n) return false;
  return config.ignoreNameParts.some((part) => n.includes(part));
}
function worldNormal(hit) {
  if (!hit.face) return new THREE.Vector3(0, 1, 0);
  const n = hit.face.normal.clone();
  n.transformDirection(hit.object.matrixWorld);
  return n;
}
function footY() { return player ? (player.position.y - playerFootOffsetY) : baseY; }
function updateTargetLane() { targetX = laneCenters[currentLane]; }

function showToast(text, ms = 520) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.style.opacity = "1";
  t.style.transform = "translateX(-50%) translateY(-6px) scale(1.02)";
  clearTimeout(showToast._to);
  showToast._to = setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateX(-50%) translateY(0px) scale(1)";
  }, ms);
}

function updateBestBoard() {
  document.getElementById("best-board").textContent = "🏆 Best: " + bestScore.toString().padStart(5, "0");
}

// ===== PARTICLES =====
function ensureParticleGroup() {
  if (particleGroup) return;
  particleGroup = new THREE.Group();
  particleGroup.name = "particles";
  scene.add(particleGroup);
}
function spawnBurst(pos, color = 0xffeb3b, count = 18, speed = 5.5, life = 0.55) {
  ensureParticleGroup();
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const vels = [];
  for (let i = 0; i < count; i++) {
    positions[i*3+0] = pos.x;
    positions[i*3+1] = pos.y;
    positions[i*3+2] = pos.z;
    const dir = new THREE.Vector3(
      (Math.random() * 2 - 1),
      (Math.random() * 2 - 0.2),
      (Math.random() * 2 - 1)
    ).normalize();
    vels.push(dir.multiplyScalar(speed * (0.35 + Math.random() * 0.9)));
  }
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.14, color, transparent: true, opacity: 0.95, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  pts.userData.vels = vels;
  pts.userData.life = life;
  pts.userData.life0 = life;
  particleGroup.add(pts);
}
function updateParticles(dt) {
  if (!particleGroup) return;
  for (let i = particleGroup.children.length - 1; i >= 0; i--) {
    const pts = particleGroup.children[i];
    const attr = pts.geometry.getAttribute("position");
    const vels = pts.userData.vels;
    pts.userData.life -= dt;
    const t = Math.max(0, pts.userData.life / pts.userData.life0);
    pts.material.opacity = 0.95 * t;
    for (let p = 0; p < vels.length; p++) {
      attr.array[p*3+0] += vels[p].x * dt;
      attr.array[p*3+1] += (vels[p].y * dt) - (2.2 * (1 - t) * dt);
      attr.array[p*3+2] += vels[p].z * dt;
    }
    attr.needsUpdate = true;
    if (pts.userData.life <= 0) {
      pts.geometry.dispose();
      pts.material.dispose();
      particleGroup.remove(pts);
    }
  }
}

async function checkUrlExists(url) {
  try {
    const r = await fetch(url, { method: "HEAD" });
    return r.ok;
  } catch { return false; }
}

function normalizeTemplateScale(sceneObj, mode = "train") {
  sceneObj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(sceneObj);
  const s = new THREE.Vector3();
  b.getSize(s);
  const maxDim = Math.max(0.0001, s.x, s.y, s.z);
  const desiredMax = (mode === "train") ? 12.0 : 1.0;
  if (maxDim > desiredMax * 6) return desiredMax / maxDim;
  if (maxDim < desiredMax * 0.2) return desiredMax / maxDim;
  return 1.0;
}

function makeCoinInstance() {
  let c;
  if (coinTemplate) {
    c = SkeletonUtils.clone(coinTemplate);
    c.scale.multiplyScalar(coinTemplateScale);
  } else {
    c = createPlaceholderCoin();
  }
  c.name = "coin_pickup";
  c.traverse(o => { if (o.isMesh) { o.castShadow = true; o.name = (o.name || "") + "_coin"; } });
  c.userData.isCoin = true;
  return c;
}

function makeTrainInstance() {
  let t;
  if (trainTemplate) {
    t = SkeletonUtils.clone(trainTemplate);
    t.scale.multiplyScalar(trainTemplateScale);
  } else {
    t = createPlaceholderTrain();
  }
  t.name = "train_active";
  t.traverse(o => { if (o.isMesh) o.castShadow = true; });
  t.updateMatrixWorld(true);
  const localBox = new THREE.Box3().setFromObject(t);
  t.userData.bottomOffset = -localBox.min.y;
  t.userData.lane = 1;
  t.userData.passed = false;
  t.userData.honked = false;

}

// ===== COINS =====
function clearCoinsOnTile(tile) {
  if (!tile.userData.coinGroup) return;
  const cg = tile.userData.coinGroup;
  while (cg.children.length) cg.remove(cg.children[0]);
  tile.userData.coins = [];
}

function findGroundYAt(x, z, preferTile = null) {
  const origin = new THREE.Vector3(x, 200, z);
  raycaster.set(origin, new THREE.Vector3(0, -1, 0));
  raycaster.far = 300;
  const targets = preferTile ? [preferTile] : mapTiles;
  const hits = raycaster.intersectObjects(targets, true);
  for (const h of hits) {
    if (!h.object || isIgnoredObject(h.object)) continue;
    const n = worldNormal(h);
    if (n.y < config.walkableNormalY) continue;
    return h.point.y;
  }
  return baseY;
}

function populateCoinsForTile(tile) {
  if (!tile) return;
  if (!tile.userData.coinGroup) {
    tile.userData.coinGroup = new THREE.Group();
    tile.userData.coinGroup.name = "coin_group";
    tile.add(tile.userData.coinGroup);
  }
  clearCoinsOnTile(tile);
  tile.userData.coins = tile.userData.coins || [];
  const cg = tile.userData.coinGroup;
  const count = params.coinsPerTile;
  const laneLastZ = [ -9999, -9999, -9999 ];
  const zStart = tile.position.z + 2.0;
  const zEnd = tile.position.z + mapLength - 2.0;

  for (let i = 0; i < count; i++) {
    const lane = Math.floor(Math.random() * 3);
    const x = laneCenters[lane];
    let z = zStart + Math.random() * (zEnd - zStart);
    let guard = 0;
    while (Math.abs(z - laneLastZ[lane]) < config.coinMinSpacing && guard < 25) {
      z = zStart + Math.random() * (zEnd - zStart);
      guard++;
    }
    laneLastZ[lane] = z;
    const groundY = findGroundYAt(x, z, tile);
    const coin = makeCoinInstance();
    coin.position.set(x, groundY + config.coinHover, z - tile.position.z);
    coin.rotation.y = Math.random() * Math.PI * 2;
    cg.add(coin);
    tile.userData.coins.push(coin);
  }
}

function updateCombo(now) {
  if (now - lastCoinTime <= config.comboWindow) {
    combo = Math.min(config.comboMax, combo + 1);
    if (combo >= 3) {
      AudioFX.sfxCombo();
      showToast(combo >= 6 ? "INSANE!" : "COMBO!");
    }
  } else {
    combo = 1;
  }
  lastCoinTime = now;
  document.getElementById("combo-board").innerText = "Combo: x" + combo;
}

function updateCoins(dt, now) {
  if (!player) return;
  const px = player.position.x;
  const py = footY() + 1.0;
  const pz = player.position.z;
  const r2 = config.coinPickupRadius * config.coinPickupRadius;

  for (const tile of mapTiles) {
    const list = tile.userData.coins;
    if (!list || list.length === 0) continue;
    for (let i = list.length - 1; i >= 0; i--) {
      const c = list[i];
      if (!c || !c.parent) { list.splice(i, 1); continue; }
      c.rotation.y += config.coinSpinSpeed * dt;
      const wp = new THREE.Vector3();
      c.getWorldPosition(wp);
      const dx = wp.x - px, dy = wp.y - py, dz = wp.z - pz;
      if ((dx*dx + dy*dy + dz*dz) <= r2) {
        c.parent.remove(c);
        list.splice(i, 1);
        coins += 1;
        updateCombo(now);
        const add = Math.floor(config.coinScore * combo);
        score += add;
        document.getElementById("coin-board").innerText = "Coins: " + coins;
        AudioFX.sfxCoin();
        spawnBurst(wp, 0xffeb3b, 18, 5.8, 0.55);
        if (combo >= 5) showToast("GOLD RUSH!");
      }
    }
  }
}

// ===== TRAINS =====
function scheduleNextTrain() { trainSpawnTimer = rand(params.trainSpawnMin, params.trainSpawnMax); }

function canSpawnTrain(lane, z) {
  for (const tr of trains) {
    if (!tr || !tr.parent) continue;
    if (tr.userData.lane !== lane) continue;
    if (Math.abs(tr.position.z - z) < config.trainLaneMinGapZ) return false;
  }
  return true;
}

function spawnTrainInLane(lane, zWorld) {
  const x = laneCenters[lane];
  const groundY = findGroundYAt(x, zWorld, null);
  const t = makeTrainInstance();
  t.userData.lane = lane;
  t.position.x = x;
  t.position.z = zWorld;
  t.position.y = groundY + (t.userData.bottomOffset || 0);
  t.rotation.y = Math.PI;
  scene.add(t);
  trains.push(t);
}

function shuffle3(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function spawnTrainWave() {
  if (!player) return;
  const count = (Math.random() < params.trainWaveChance2) ? 2 : 1;
  const baseZ = player.position.z + rand(config.trainSpawnZMin, config.trainSpawnZMax);
  const lanes = shuffle3([0, 1, 2]);
  let spawned = 0;
  for (let i = 0; i < lanes.length && spawned < count; i++) {
    const lane = lanes[i];
    const z = baseZ + (spawned === 0 ? 0 : rand(-config.trainWaveZJitter, config.trainWaveZJitter));
    if (!canSpawnTrain(lane, z)) continue;
    spawnTrainInLane(lane, z);
    spawned++;
  }
  let guard = 0;
  while (spawned < count && guard++ < 6) {
    const lane = Math.floor(Math.random() * 3);
    const z = baseZ + rand(-10, 10);
    if (!canSpawnTrain(lane, z)) continue;
    spawnTrainInLane(lane, z);
    spawned++;
  }
  if (spawned > 0 && Math.random() < 0.55) AudioFX.sfxHorn();
  if (spawned === 2) showToast("DOUBLE TROUBLE!");
}

function sphereIntersectsBox(center, radius, box) {
  const x = Math.max(box.min.x, Math.min(center.x, box.max.x));
  const y = Math.max(box.min.y, Math.min(center.y, box.max.y));
  const z = Math.max(box.min.z, Math.min(center.z, box.max.z));
  const dx = x - center.x, dy = y - center.y, dz = z - center.z;
  return (dx*dx + dy*dy + dz*dz) <= radius*radius;
}

function updateTrains(dt) {
  if (!player) return;
  trainSpawnTimer -= dt;
  if (trainSpawnTimer <= 0) {
    spawnTrainWave();
    scheduleNextTrain();
  }
  const playerZ = player.position.z;
  for (let i = trains.length - 1; i >= 0; i--) {
    const t = trains[i];
    if (!t || !t.parent) { trains.splice(i, 1); continue; }
    t.position.z -= params.trainSpeed * dt;
    const dzWarn = t.position.z - playerZ;
    if (!t.userData.honked && dzWarn < 45 && dzWarn > 20) {
      t.userData.honked = true;
      if (Math.random() < 0.5) AudioFX.sfxHorn();
    }
    if (t.position.z < playerZ - config.trainDespawnBehind) {
      t.parent.remove(t);
      trains.splice(i, 1);
      continue;
    }
    const center = new THREE.Vector3(player.position.x, footY() + 1.2, player.position.z);
    const radius = config.trainPickupRadius;
    t.updateMatrixWorld(true);
    const worldBox = t.userData._worldBox || new THREE.Box3();
    t.userData._worldBox = worldBox;
    worldBox.setFromObject(t);
    if (sphereIntersectsBox(center, radius, worldBox)) {
      const fy = footY();
      if (fy > (worldBox.max.y - config.trainTopSafeEps)) {
        // safe - standing on top
      } else {
        gameOver();
        return;
      }
    }
    if (!t.userData.passed && t.position.z < playerZ) {
      t.userData.passed = true;
      const dx = Math.abs(player.position.x - t.position.x);
      const dz = Math.abs(playerZ - t.position.z);
      if (dx <= config.nearMissMaxDX && dz <= config.nearMissMaxDZ) {
        const bonus = config.nearMissBonus + Math.floor(120 * combo);
        score += bonus;
        shakeAmp = Math.min(1.0, shakeAmp + config.nearMissShake);
        AudioFX.sfxNear();
        showToast("SO CLOSE!");
        spawnBurst(new THREE.Vector3(player.position.x, footY() + 1.2, playerZ), 0x80d8ff, 22, 7.0, 0.45);
      }
    }
  }
}

  camera = new THREE.PerspectiveCamera(config.fovBase, window.innerWidth / window.innerHeight, 0.1, 800);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  document.getElementById("game-container").appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(20, 50, -20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(1024, 1024);
  dirLight.shadow.camera.left = -30;
  dirLight.shadow.camera.right = 30;
  dirLight.shadow.camera.top = 30;
  dirLight.shadow.camera.bottom = -30;
  scene.add(dirLight);

  clock = new THREE.Clock();
  raycaster = new THREE.Raycaster();

  window.addEventListener("resize", onWindowResize);
  window.addEventListener("keydown", handleInput);

  const btnMute = document.getElementById("btn-mute");
  const volSlider = document.getElementById("vol");
  btnMute.addEventListener("click", async () => {

    btnMute.textContent = AudioFX.muted ? "🔇" : "🔊";
  });

    AudioFX.setVolume(parseInt(volSlider.value, 10) / 100);
  });

function handleInput(event) {
  if (isGameOver) return;
  const key = event.key.toLowerCase();

  if (key === "p") {
    if (!isGameRunning) return;
    isPaused = !isPaused;
    document.getElementById("pause-overlay").style.display = isPaused ? "flex" : "none";
    if (!isPaused) clock.getDelta();
    return;
  }

  if (!player) return;
  if (isPaused) return;

  if ((key === "a" || key === "arrowleft") && currentLane > 0) {
    currentLane--;
    updateTargetLane();
    AudioFX.sfxSwitch();
  }
  if ((key === "d" || key === "arrowright") && currentLane < 2) {
    currentLane++;
    updateTargetLane();
    AudioFX.sfxSwitch();
  }
  if ((key === "w" || key === "arrowup" || key === " ")) {
    jumpBufferTimer = config.jumpBufferTime;
  }
  if ((key === "s" || key === "arrowdown") && !isRolling && !isJumping) roll();
}

function jump() {
  verticalVelocity = params.jumpForce;
  isJumping = true;
  coyoteTimer = 0;
  jumpBufferTimer = 0;
  playAnimation("jump", 0.1, false);
  AudioFX.sfxJump();
}

function roll() {
  isRolling = true;
  rollTimer = 0.8;
  playAnimation("roll", 0.1, false);
  AudioFX.sfxRoll();
}

function cleanAnimation(clip) {
  if (!clip) return;
  const tracks = [];
  for (const track of clip.tracks) if (!track.name.endsWith(".position")) tracks.push(track);
  clip.tracks = tracks;
  return clip;
}

function playAnimation(name, fadeDuration = 0.2, loop = true) {
  if (!actions[name]) return;
  const newAction = actions[name];
  if (activeAction !== newAction) {
    if (activeAction) activeAction.fadeOut(fadeDuration);
    newAction.reset();
    newAction.setEffectiveTimeScale(1);
    newAction.setEffectiveWeight(1);
    newAction.clampWhenFinished = !loop;
    newAction.loop = loop ? THREE.LoopRepeat : THREE.LoopOnce;
    newAction.fadeIn(fadeDuration).play();
    activeAction = newAction;
  }
}

// ===== MAP =====
function initMapSystem() { for (let i = 0; i < 6; i++) spawnMapTile(i * mapLength); }

function spawnMapTile(zPos) {
  const tile = mapTemplate ? SkeletonUtils.clone(mapTemplate) : createPlaceholderMap();
  tile.position.set(0, 0, zPos);
  scene.add(tile);
  mapTiles.push(tile);
  populateCoinsForTile(tile);
}

function updateMap() {
  if (mapTiles.length === 0) return;
  if (player.position.z > mapTiles[0].position.z + mapLength) {
    const tile = mapTiles.shift();
    const lastTileZ = mapTiles.length ? mapTiles[mapTiles.length - 1].position.z : 0;
    tile.position.z = lastTileZ + mapLength;
    mapTiles.push(tile);
    populateCoinsForTile(tile);
  }
}

// ===== GROUND / COLLISION =====
function updateGround(dt) {
  if (!player || mapTiles.length === 0) return;
  const fY = footY();
  const origin = player.position.clone();
  origin.y = player.position.y + config.groundRayUp;
  raycaster.set(origin, new THREE.Vector3(0, -1, 0));
  raycaster.far = config.groundRayUp + config.groundRayDown;
  const hits = raycaster.intersectObjects(mapTiles, true);
  for (const h of hits) {
    if (!h.object || isIgnoredObject(h.object)) continue;
    const n = worldNormal(h);
    if (n.y < config.walkableNormalY) continue;
    const groundY = h.point.y;
    if (isJumping) {
      if (verticalVelocity > 0) continue;
      if (groundY > fY + config.landingSnapEps) continue;
      if ((fY - groundY) > config.landingMaxDrop) continue;
      baseY = groundY;
      player.position.y = baseY + playerFootOffsetY;
      isJumping = false;
      verticalVelocity = 0;
      if (!isRolling) playAnimation("run");
      return;
    } else {
      if (groundY - baseY > config.maxStepUp) continue;
      const a = smoothAlpha(config.groundSnapSpeed, dt);
      baseY = THREE.MathUtils.lerp(baseY, groundY, a);
      player.position.y = baseY + playerFootOffsetY;
      coyoteTimer = config.coyoteTime;
      return;
    }
  }
}

function checkCollisionMap() {
  if (!player || mapTiles.length === 0) return;
  const fY = footY();
  const heights = isRolling ? config.collisionHeightsRoll : config.collisionHeightsStand;
  const forward = new THREE.Vector3(0, 0, 1);
  for (const h of heights) {
    const origin = new THREE.Vector3(player.position.x, fY + h, player.position.z);
    raycaster.set(origin, forward);
    raycaster.far = params.collisionDistance;
    const hits = raycaster.intersectObjects(mapTiles, true);
    for (const hit of hits) {
      if (!hit.object || isIgnoredObject(hit.object)) continue;
      const n = worldNormal(hit);
      if (n.y >= config.walkableNormalY) continue;
      if (n.z > config.frontalNormalZThreshold) continue;
      if (hit.point.y <= fY + config.collisionIgnoreBelowFeet) continue;
      gameOver();
      return;
    }
  }
}

function gameOver() {
  isGameRunning = false;
  isGameOver = true;
  isPaused = false;
  if (activeAction) activeAction.stop();
  AudioFX.sfxGameOver();
  AudioFX.stopMusic();
  document.getElementById("pause-overlay").style.display = "none";
  document.getElementById("game-over-screen").style.display = "flex";

  const isNewBest = Math.floor(score) > bestScore;
  if (isNewBest) {
    bestScore = Math.floor(score);
    localStorage.setItem("metroBest", bestScore);
  }
  const finalHTML = [
    (isNewBest ? '<span class="newbest">🎉 KỶ LỤC MỚI!</span><br/>' : ''),
    "Score: " + Math.floor(score).toString().padStart(5, "0"),
    "Coins: " + coins,
    "Combo Max: x" + combo,
    "Best: " + bestScore.toString().padStart(5, "0")
  ].join("<br/>");
  document.getElementById("final-score").innerHTML = finalHTML;
}

// ===== UPDATE =====
function update(dt, now) {
  if (player) {
    const speed01 = Math.min(1, params.runSpeed / params.runSpeedMax);
    const targetFov = config.fovBase + config.fovMaxAdd * speed01;
    camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, smoothAlpha(4.0, dt));
    camera.updateProjectionMatrix();

    shakeAmp = Math.max(0, shakeAmp - config.cameraShakeDecay * dt);
    const shakeX = (Math.random() * 2 - 1) * 0.18 * shakeAmp;
    const shakeY = (Math.random() * 2 - 1) * 0.14 * shakeAmp;

    const camTargetX = player.position.x + shakeX;
    const camTargetZ = player.position.z - config.camDist;
    const camTargetY = player.position.y + config.camHeight + shakeY;

    const a = smoothAlpha(6.0, dt);
    camera.position.x = THREE.MathUtils.lerp(camera.position.x, camTargetX, a);
    camera.position.y = THREE.MathUtils.lerp(camera.position.y, camTargetY, a);
    camera.position.z = THREE.MathUtils.lerp(camera.position.z, camTargetZ, a);
    camera.lookAt(player.position.x, player.position.y + config.camLookHeight, player.position.z + 8);

    if (now - lastDebugUpdate > 0.15) {
      lastDebugUpdate = now;
      updateBestBoard();
    }
  }

  if (!isGameRunning || isGameOver || !player || mapTiles.length === 0) return;
  if (isPaused) return;

  params.runSpeed = Math.min(params.runSpeed + params.speedAccel * dt, params.runSpeedMax);
  player.position.z += params.runSpeed * dt;

  const ax = smoothAlpha(params.laneSwitchSpeed, dt);
  player.position.x = THREE.MathUtils.lerp(player.position.x, targetX, ax);
  if (Math.abs(player.position.x - targetX) <= config.laneSnapEps) player.position.x = targetX;

  updateGround(dt);

  // Coyote & jump buffer
  coyoteTimer -= dt;
  jumpBufferTimer -= dt;
  if (jumpBufferTimer > 0 && coyoteTimer > 0 && !isJumping && !isRolling) {
    jump();
  }

  const groundPivotY = baseY + playerFootOffsetY;
  if (isJumping) {
    player.position.y += verticalVelocity * dt;
    verticalVelocity -= params.gravity * dt;
    if (player.position.y <= groundPivotY) {
      player.position.y = groundPivotY;
      isJumping = false;
      verticalVelocity = 0;
      if (!isRolling) playAnimation("run");
    }
  } else {
    if (player.position.y < groundPivotY) player.position.y = groundPivotY;
  }

  if (isRolling) {
    rollTimer -= dt;
    if (rollTimer <= 0) {
      isRolling = false;
      if (!isJumping) playAnimation("run");
    }
  }

  updateCoins(dt, now);
  updateTrains(dt);
  if (isGameOver) return;

  checkCollisionMap();
  if (isGameOver) return;

  if (mixer) mixer.update(dt);
  updateMap();
  updateParticles(dt);

  score += (params.runSpeed * dt * 10) * (1 + (combo - 1) * 0.05);
  document.getElementById("score-board").innerText = Math.floor(score).toString().padStart(5, "0");
}

function render() { renderer.render(scene, camera); }

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now() / 1000;
  update(dt, now);
  render();
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ===== LOAD ASSETS + START =====
async function loadAll() {
  const statusEl = document.getElementById("asset-status");
  const miniLoading = document.getElementById("mini-loading");

  // Kiểm tra 4 file có tồn tại không
  const checks = await Promise.all([
    checkUrlExists(MODEL_PATHS.player),
    checkUrlExists(MODEL_PATHS.map),
    checkUrlExists(MODEL_PATHS.coin),
    checkUrlExists(MODEL_PATHS.train)
  ]);

  const statuses = [];
  statuses.push((checks[0] ? "✅" : "⬜") + " player.glb");
  statuses.push((checks[1] ? "✅" : "⬜") + " map.glb");
  statuses.push((checks[2] ? "✅" : "⬜") + " coin.glb");
  statuses.push((checks[3] ? "✅" : "⬜") + " train.glb");
  if (statusEl) statusEl.innerHTML = "models/: " + statuses.join(" · ");

  if (miniLoading) miniLoading.style.display = "block";

  const loader = new GLTFLoader();
  const promises = [];

  // Player
  promises.push(new Promise((resolve) => {
    if (!checks[0]) { resolve(); return; }
    loader.load(MODEL_PATHS.player, (gltf) => { onPlayerLoaded(gltf); resolve(); },
      undefined,
      (err) => { console.warn("Player load fail, dùng placeholder", err); resolve(); });
  }));

  // Map
  promises.push(new Promise((resolve) => {
    if (!checks[1]) { resolve(); return; }
    loader.load(MODEL_PATHS.map, (gltf) => {
      const rawMap = gltf.scene;
      const box = new THREE.Box3().setFromObject(rawMap);
      const size = new THREE.Vector3(); box.getSize(size);
      const wrapper = new THREE.Group();
      if (size.x > size.z) rawMap.rotation.y = -Math.PI / 2;
      rawMap.rotation.y += Math.PI;
      wrapper.add(rawMap);
      const finalBox = new THREE.Box3().setFromObject(wrapper);
      const finalSize = new THREE.Vector3(); finalBox.getSize(finalSize);
      const finalCenter = new THREE.Vector3(); finalBox.getCenter(finalCenter);
      mapTemplate = new THREE.Group();
      mapTemplate.add(wrapper);
      wrapper.position.set(-finalCenter.x, -finalBox.min.y, -finalBox.min.z);
      if (finalSize.z > 10) mapLength = finalSize.z;
      resolve();
    }, undefined, (err) => { console.warn("Map load fail", err); resolve(); });
  }));

  // Coin
  promises.push(new Promise((resolve) => {
    if (!checks[2]) { resolve(); return; }
    loader.load(MODEL_PATHS.coin, (gltf) => {
      coinTemplate = gltf.scene;
      coinTemplate.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
      coinTemplateScale = normalizeTemplateScale(coinTemplate, "coin");
      resolve();
    }, undefined, (err) => { console.warn("Coin load fail", err); resolve(); });
  }));

  // Train
  promises.push(new Promise((resolve) => {
    if (!checks[3]) { resolve(); return; }
    loader.load(MODEL_PATHS.train, (gltf) => {
      trainTemplate = gltf.scene;
      trainTemplate.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
      trainTemplateScale = normalizeTemplateScale(trainTemplate, "train");
      resolve();
    }, undefined, (err) => { console.warn("Train load fail", err); resolve(); });
  }));

  await Promise.all(promises);

  // Nếu player chưa được set (không có file) → dùng placeholder
  if (!player) {
    const placeholder = createPlaceholderPlayer();
    onPlayerLoaded({ scene: placeholder, animations: [] });
  }

  if (miniLoading) miniLoading.style.display = "none";

  // Init map + spawn
  initMapSystem();
  scheduleNextTrain();
  animate();
  AudioFX.setVolume(parseInt(document.getElementById("vol").value, 10) / 100);

  // Chuyển sang trạng thái "sẵn sàng chơi"
  statusEl.innerHTML += "<br/><span style='color:#4caf50;font-weight:bold;'>Sẵn sàng!</span>";
  document.getElementById("play-btn").textContent = "▶ BẮT ĐẦU";
}

function onPlayerLoaded(gltf) {
  player = gltf.scene;
  player.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  player.rotation.y = 0;
  player.position.set(0, 3, 29);
  scene.add(player);

  player.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(player);
  playerFootOffsetY = player.position.y - box.min.y;
  baseY = box.min.y;

  laneCenters = [ ...FIXED_LANE_XS ];
  currentLane = 1;
  updateTargetLane();
  player.position.x = targetX;

  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(player);
    const animations = gltf.animations;
    animations.forEach(cleanAnimation);
    const getClip = (name) => animations.find(a => a.name.toLowerCase().includes(name));
    const runClip = getClip("run") || animations[0];
    const jumpClip = getClip("jump") || runClip;
    const rollClip = getClip("roll") || runClip;
    if (runClip) actions.run = mixer.clipAction(runClip);
    if (jumpClip) actions.jump = mixer.clipAction(jumpClip);
    if (rollClip) actions.roll = mixer.clipAction(rollClip);
    playAnimation("run");
  }
}

// ===== START GAME =====
function startGame() {
  if (!player) return;

  laneCenters = [ ...FIXED_LANE_XS ];
  currentLane = 1;
  updateTargetLane();
  baseY = player.position.y - playerFootOffsetY;
  player.position.x = targetX;

  score = 0;
  coins = 0;
  combo = 1;
  lastCoinTime = -9999;
  document.getElementById("coin-board").innerText = "Coins: 0";
  document.getElementById("combo-board").innerText = "Combo: x1";

  const startZ = player.position.z;
  mapTiles.forEach(tile => scene.remove(tile));
  mapTiles = [];
  for (let i = 0; i < 6; i++) spawnMapTile(startZ + i * mapLength);

  for (const tr of trains) if (tr?.parent) tr.parent.remove(tr);
  trains = [];
  scheduleNextTrain();

  showToast("RUN!");
  isGameRunning = true;
  isGameOver = false;
  isPaused = false;
  document.getElementById("pause-overlay").style.display = "none";
  if (activeAction) activeAction.play();
}

// ===== TAP TO START FLOW =====
let gameReady = false;

async function onTapStart() {
  if (!gameReady) return;  // chờ model load xong
  document.getElementById("tap-to-start").style.display = "none";
  document.getElementById("score-board").style.display = "block";
  document.getElementById("coin-board").style.display = "block";
  document.getElementById("combo-board").style.display = "block";
  document.getElementById("best-board").style.display = "block";
  document.getElementById("hud-controls").style.display = "flex";
  await AudioFX.unlock();
  AudioFX.setMuted(AudioFX.muted);
  document.getElementById("btn-mute").textContent = AudioFX.muted ? "🔇" : "🔊";
  startGame();
}

// ===== MOBILE TOUCH =====
function setupTouchControls() {
  document.querySelectorAll(".touch-btn").forEach(btn => {
    const key = btn.dataset.key;
    const fire = (e) => {
      e.preventDefault();
      handleInput({ key, shiftKey: false });
    };
    btn.addEventListener("touchstart", fire, { passive: false });
    btn.addEventListener("mousedown", fire);
  });
}

// ===== BOOT =====
window.addEventListener("load", async () => {
  init();

  // Click overlay: nếu chưa ready thì chờ, nếu ready thì vào game
  const tapStart = document.getElementById("tap-to-start");
  tapStart.addEventListener("click", async () => {
    if (!gameReady) {
      // Nhấn khi đang load → unlock audio luôn
      await AudioFX.unlock();
      return;
    }
    onTapStart();
  });

  // Load models
  await loadAll();
  gameReady = true;
  document.getElementById("play-btn").textContent = "▶ CHƠI NGAY";

  setupTouchControls();
});
</script>
