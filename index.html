<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiHuynhRoblox - Shop Acc Roblox Uy Tín</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
        }
        /* Header */
        header {
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo img {
            height: 40px;
        }
        .btn-login {
            background-color: #e74c3c;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        /* Banner */
        .banner {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
        }
        .banner img {
            width: 100%;
            display: block;
        }

        /* Container */
        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Box Xếp Hạng */
        .ranking-box {
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .ranking-title {
            background: #e74c3c;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .ranking-item span:last-child {
            color: #e74c3c;
            font-weight: bold;
        }

        /* Nút Nạp Ngay */
        .btn-nap {
            display: block;
            background-color: #e74c3c;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin: 15px 0;
            text-transform: uppercase;
        }

        /* Tiêu đề danh mục */
        .section-title {
            color: #e74c3c;
            font-size: 18px;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-left: 4px solid #e74c3c;
            padding-left: 8px;
        }

        /* Lưới sản phẩm */
        .grid-products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .product-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .product-info {
            padding: 10px;
        }
        .product-name {
            font-size: 13px;
            font-weight: bold;
            height: 35px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .product-price {
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .btn-buy {
            display: block;
            background-color: #e74c3c;
            color: white;
            text-align: center;
            padding: 6px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <strong>BIHUYNH</strong>
        </div>
        <a href="#" class="btn-login">ĐĂNG NHẬP</a>
    </header>

    <!-- Banner -->
    <div class="banner">
        <img src="https://via.placeholder.com/600x200/333/fff?text=Banner+Shop+Roblox" alt="Banner">
    </div>

    <div class="container">
        <!-- Bảng xếp hạng nạp thẻ -->
        <div class="ranking-box">
            <div class="ranking-title">TOP NẠP THẺ THÁNG 10</div>
            <div class="ranking-item">
                <span>1. katanashi</span>
                <span>12.150.000đ</span>
            </div>
            <div class="ranking-item">
                <span>2. gosukumi</span>
                <span>11.850.000đ</span>
            </div>
            <div class="ranking-item">
                <span>3. akitino</span>
                <span>11.200.000đ</span>
            </div>
        </div>

        <a href="#" class="btn-nap">NẠP THẺ NGAY</a>

        <!-- Danh mục sản phẩm -->
        <div class="section-title">Mua Robux</div>
        <div class="grid-products">
            <!-- Sản phẩm 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x150/ff4d4d/fff?text=Robux+120H" alt="Robux">
                <div class="product-info">
                    <div class="product-name">ROBUX 120H GAMEPASS</div>
                    <div class="product-price">Đã bán: 12.490</div>
                    <a href="#" class="btn-buy">Đang Giảm Giá 70%</a>
                </div>
            </div>
            <!-- Sản phẩm 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/300x150/ff4d4d/fff?text=Robux+VNG" alt="Robux">
                <div class="product-info">
                    <div class="product-name">ROBUX VNG AUTO</div>
                    <div class="product-price">Đã bán: 5.037</div>
                    <a href="#" class="btn-buy">Đang Giảm Giá 70%</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
